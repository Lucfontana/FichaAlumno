<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Ficha</title>
</head>

<body>
    <h1>Ficha del Alumno</h1>
    <div class="flex">
        <form id="form">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required placeholder="Nombre">
            <label for="apellido">Apellido:</label>
            <input type="text" name="" id="apellido" required placeholder="Apellido">
            <label for="email">Email:</label>
            <input type="email" name="" id="email" required placeholder="Email">
            <label for="contrasena">Contraseña:</label>
            <input type="password" name="" id="contrasena" required placeholder="Contraseña">
            <label for="repcontrasena">Repite tu contraseña:</label>
            <input type="password" name="" id="repcontrasena"  type="password" required placeholder="Repite tu contraseña">
            <label for="fnac">Fecha nacimiento:</label>
            <input type="date" name="" id="fnac" required placeholder="Fecha de nacimiento">
            <label for="ciudad">Ciudad:</label>
            <input type="text" name="" id="ciudad" required placeholder="Ciudad">
            <label for="tel">Tel/Cel:</label>
            <input type="text" name="" id="tel" required placeholder="Teléfono/Celular">

            <input id="envFormulario" type="submit" value="Enviar"></input>
            <input id="envFormulario" type="reset"></input>
        
            <div id="mensaje" style="color:red;"></div>

        </form>

        <div class="respuesta">
            <p id="nameResp"></p>
            <p id="apellidoResp"></p>
            <p id="emailResp"></p>
            <p id="contrasenaResp"></p>
            <p id="fnacResp"></p>
            <p id="ciudadResp"></p>
            <p id="telResp"></p>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">Footer original con BootStrap!</h5>
            <p class="card-text">Este es un footer... y ta</p>
            <p class="card-text"><small class="text-body-secondary">Last updated 91 mins ago</small></p>
            <p class="card-text"><small class="text-body-secondary">Lautaro Cardozo - Luca Fontana - Isis Gonzalez - Abril Manek</small></p>
            <p class="card-text">Todos los derechos reservados 🤺🤗😝🤑</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
